name: Tests

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

permissions:
  checks: write
  contents: read

jobs:
  editmode-tests:
    name: EditMode Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # GameCI cannot test a package at the repo root (issue #223).
      # Move everything into a subdirectory as a workaround.
      - name: Move package to subdirectory
        run: |
          mkdir package
          shopt -s dotglob
          for item in *; do
            [ "$item" = "package" ] && continue
            mv "$item" package/
          done

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          packageMode: true
          projectPath: package
          unityVersion: '6000.0.36f1'
          testMode: EditMode
          scopedRegistryUrl: 'https://package.openupm.com'
          registryScopes: 'com.cysharp'
          artifactsPath: editmode-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode Test Results
          coverageOptions: >-
            generateAdditionalMetrics;generateHtmlReport;generateBadgeReport;assemblyFilters:+Dev.Cortez.StateMachines.*

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editmode-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}

      - name: Upload coverage results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editmode-coverage-results
          path: ${{ steps.tests.outputs.coveragePath }}
